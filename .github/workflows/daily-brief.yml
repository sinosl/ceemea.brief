name: Daily brief

on:
  schedule:
    - cron: "17 5 * * 1-5"     # 05:17 UTC on weekdays (06:17 London in summer, 05:17 in winter)
  workflow_dispatch:            # "Run workflow" button for a manual run

permissions:
  contents: write               # lets the job commit the new brief back to the repo
  

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Build brief
        env:
                    LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # free key from aistudio.google.com
        run: python -m ceemea_brief.pipeline --date "$(date -u +%F)"

      - name: Publish
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs data
          git commit -m "Brief $(date -u +%F)" || echo "Nothing new to commit"
          git push
